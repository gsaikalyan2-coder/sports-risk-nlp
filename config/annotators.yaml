# The Phase 11 annotator roster -- the people who may write into `data/gold/`.
#
# WHY THIS FILE EXISTS
#
# `src/annotation/store.py` refuses to write a gold label whose `annotator_id`
# is not listed here. Adding yourself is a deliberate act.
#
# PSEUDONYMOUS BY DESIGN
#
# Ids are role-based pseudonyms, not names or email addresses. `docs/ethics.md`
# governs the athletes in the corpus; keep the mapping from id to person out of
# the repository.
#
# CLAUDE.md sec.4: no agent writes data/gold/. There is no entry here for a
# model, and `GoldLabel` has no author kind that would permit one.
#
# -----------------------------------------------------------------------------
# SINGLE-ANNOTATOR BY DECISION (2026-09-28)
#
# This project does not report inter-annotator agreement. A2 had been recruited
# (a teammate of the owner, sports-domain familiarity) but never annotated
# anything, and time no longer allows waiting on that. The owner decided to
# proceed on A1's single pass over `gold_dev` (96/100 items, span-anchored) and
# to drop the IAA claim entirely rather than leave it perpetually pending.
#
# As a direct consequence, `src/annotation/agreement.py` and
# `src/taxonomy/refinement.py` (the disagreement-driven taxonomy analysis) were
# deleted -- backed up under
# `annotation/gold_dev/_backup_2026-09-28/removed_20260928/` -- and
# `scripts/run_taxonomy_refinement.py --refine` no longer exists. See
# `CLAUDE.md` sec.20-21 for the full reasoning, what was declined along the
# way, and what this means for the paper's claims.
#
# Adding a real A2 back here later is still possible; it would require
# restoring the two deleted modules from backup, not just adding a line.
# -----------------------------------------------------------------------------

version: 1

annotators:
  - annotator_id: A1
    role: project owner; sole annotator
    is_owner: true
