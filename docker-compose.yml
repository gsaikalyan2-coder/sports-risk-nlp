services:
  app:
    build: .
    env_file: .env
    volumes:
      - .:/app
    working_dir: /app
    command: bash
    tty: true

  dashboard:
    build: .
    env_file: .env
    volumes:
      - .:/app
    working_dir: /app
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
