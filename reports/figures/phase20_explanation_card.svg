<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486"><rect width="760" height="486" fill="#fcfcfb"/><svg x="0" y="0" xmlns="http://www.w3.org/2000/svg" width="760" height="96" viewBox="0 0 760 96" role="img" aria-label="Risk index meter, ranking only, not calibrated"><rect width="760" height="96" fill="#fcfcfb"/><text x="16" y="20" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">Risk index</text><text x="744" y="20" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" fill="#0b0b0b" text-anchor="end">0.87</text><rect x="16" y="38" width="728" height="10" rx="5" fill="#e1e0d9"/><rect x="16" y="38" width="633.6" height="10" rx="5" fill="#2a78d6"/><line x1="649.6" y1="32" x2="649.6" y2="54" stroke="#0b0b0b" stroke-width="2.5"/><text x="16" y="68" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#898781">0</text><text x="744" y="68" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#898781" text-anchor="end">1</text><text x="16" y="86" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#898781">ranking only — not calibrated; no observed outcome exists to calibrate against</text></svg><svg x="0" y="96" xmlns="http://www.w3.org/2000/svg" width="760" height="316" viewBox="0 0 760 316" role="img" aria-label="Signed contribution to the risk index, per construct"><defs><pattern id="inert-hatch-8c75200e" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fcfcfb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#898781" stroke-width="2"/></pattern></defs><rect width="760" height="316" fill="#fcfcfb"/><text x="8" y="18" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#0b0b0b" font-weight="600">Contribution to the risk index</text><text x="8" y="34" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#898781">left of the rule lowers risk, right raises it — sign is position, not colour</text><text x="8" y="63.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781">appraisal orientation (inert)</text><rect x="441.0" y="51.0" width="18" height="14" fill="url(#inert-hatch-8c75200e)" stroke="#898781" stroke-width="1.5" stroke-dasharray="3 2" rx="3"/><text x="466.0" y="63.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#898781" font-style="italic">inert — no direction</text><text x="8" y="89.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781">attentional focus (inert)</text><rect x="441.0" y="77.0" width="18" height="14" fill="url(#inert-hatch-8c75200e)" stroke="#898781" stroke-width="1.5" stroke-dasharray="3 2" rx="3"/><text x="466.0" y="89.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#898781" font-style="italic">inert — no direction</text><text x="8" y="115.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#0b0b0b">burnout signal</text><rect x="450.0" y="103.0" width="242.0" height="14" fill="#e34948" rx="3"/><text x="698.0" y="115.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="start">+1.335</text><text x="8" y="141.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#0b0b0b">cognitive anxiety</text><rect x="450.0" y="129.0" width="40.2" height="14" fill="#e34948" rx="3"/><text x="496.2" y="141.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="start">+0.222</text><text x="8" y="167.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781">coping style (inert)</text><rect x="441.0" y="155.0" width="18" height="14" fill="url(#inert-hatch-8c75200e)" stroke="#898781" stroke-width="1.5" stroke-dasharray="3 2" rx="3"/><text x="466.0" y="167.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#898781" font-style="italic">inert — no direction</text><text x="8" y="193.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781">motivation orientation (inert)</text><rect x="441.0" y="181.0" width="18" height="14" fill="url(#inert-hatch-8c75200e)" stroke="#898781" stroke-width="1.5" stroke-dasharray="3 2" rx="3"/><text x="466.0" y="193.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#898781" font-style="italic">inert — no direction</text><text x="8" y="219.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#0b0b0b">perceived stress</text><rect x="450.0" y="207.0" width="13.8" height="14" fill="#e34948" rx="3"/><text x="469.8" y="219.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="start">+0.076</text><text x="8" y="245.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#0b0b0b">resilience</text><rect x="442.7" y="233.0" width="7.3" height="14" fill="#2a78d6" rx="3"/><text x="436.7" y="245.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="end">-0.040</text><text x="8" y="271.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#0b0b0b">self confidence</text><rect x="447.1" y="259.0" width="2.9" height="14" fill="#2a78d6" rx="3"/><text x="441.1" y="271.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="end">-0.016</text><text x="8" y="297.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#0b0b0b">somatic anxiety</text><rect x="450.0" y="285.0" width="59.3" height="14" fill="#e34948" rx="3"/><text x="515.3" y="297.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#0b0b0b" text-anchor="start">+0.327</text><line x1="450.0" y1="46" x2="450.0" y2="306" stroke="#c3c2b7" stroke-width="1.5"/></svg><text x="8" y="428" font-family="system-ui, sans-serif" font-size="9" fill="#52514e">Two-level explanation for one synthetic record. Sign is encoded by position relative to the rule, not by colour;</text><text x="8" y="441" font-family="system-ui, sans-serif" font-size="9" fill="#52514e">the four directionally unresolved constructs carry a hatched, dashed marker and an explicit (inert) label.</text><text x="8" y="454" font-family="system-ui, sans-serif" font-size="9" fill="#52514e">PROVISIONAL — planted-label corpus-property measurement, NOT accuracy. data/gold/ is empty (OPEN-025); no real</text><text x="8" y="467" font-family="system-ui, sans-serif" font-size="9" fill="#52514e">athlete text exists (OPEN-011).</text></svg>
