# Pre-commit hooks — run automatically on `git commit`.
# Install once per clone:  pre-commit install
# Run over the whole repo:  pre-commit run --all-files
#
# Two jobs here:
#   1. Formatting / linting -> ruff (matches [tool.ruff] in pyproject.toml)
#   2. Secret scanning      -> detect-secrets (blocks API keys from being committed)

repos:
  # --- basic hygiene -------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]   # keep datasets/models out of git history
      - id: detect-private-key

  # --- lint + format (Python) ---------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # --- secret scanning -----------------------------------------------------
  # .secrets.baseline is the "already reviewed" list. If this hook fails, a NEW
  # potential secret was found: remove it, or if it is a false positive run
  #   detect-secrets scan --baseline .secrets.baseline
  # and audit it with `detect-secrets audit .secrets.baseline`.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: (?x)^(\.secrets\.baseline|\.env\.example|data/.*|paper/.*)$
