[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-risk-nlp"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks", ".venv", "data", "paper"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = import sorting, UP = pyupgrade, B = bugbear.
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
  "E501",   # line length is enforced by the formatter, not the linter
  "EXE002", # file-permission noise on Windows/WSL mounts
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# `-m "not slow"` by default, and this is load-bearing rather than a
# convenience. Everything in this suite is meant to be offline, deterministic
# and free; the one exception is the Phase 14 fine-tune smoke test, which needs
# the Hugging Face hub. Leaving it in the default run means `pytest` fails when
# the network is down, when the hub rate-limits, or when a checkpoint's config
# changes upstream -- none of which is a defect in this repository, and all of
# which look like one in a red test report. Observed 2026-08-12.
#
# Run the integration test deliberately:  pytest -m slow
addopts = '-q -m "not slow"'

markers = [
    # Phase 14. A fine-tune, even a one-epoch one on a tiny checkpoint, is
    # minutes rather than milliseconds, needs requirements-ml.txt, and needs
    # network access to the hub. Excluded from the default run by `addopts`.
    "slow: needs the ML stack and the HF hub; minutes, not milliseconds",
]
